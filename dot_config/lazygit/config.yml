git:
  autoFetch: false
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
os:
  # `e` / `E` — edit in Neovim, in place, taking over the lazygit terminal.
  editPreset: 'nvim'
  # `o` — "open". Routes text to Neovim in a new cmux surface and leaves images,
  # PDFs, media and archives to the macOS default app. See ~/bin/open-smart.
  open: '$HOME/bin/open-smart {{filename}}'
  openLink: 'open {{link}}'
gui:
  scrollHeight: 10
customCommands:
  # GitHub-PR-style diff: what the current branch introduces relative to the
  # selected base branch, using a 3-dot (merge-base) diff. Focus the Local
  # Branches panel (press 3), select the base branch (e.g. main), then press D.
  # NB: ctrl+p is a reserved global binding (View custom patch options).
  - key: "D"
    context: "localBranches"
    description: "PR diff (base...HEAD)"
    command: "git diff {{.SelectedLocalBranch.Name}}...HEAD"
    output: terminal
